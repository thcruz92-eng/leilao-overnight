name: Coleta diária COTAHIST

# ====================================================================
# v2 — corrige o incidente de 04/09/2026
#
# O que aconteceu: às 00h08 de sábado a B3 ainda não tinha publicado o
# COTAHIST de sexta (HTTP 404, comprovado no log). A verificação disse
# "as próximas janelas vão tentar de novo" e deixou o job VERDE. Só que
# as janelas de rede de segurança rodavam "1-5" (segunda a sexta), e
# 05/09 era sábado. Nenhuma nova tentativa até segunda. A base ficou
# parada em 03/09 por dois dias, sem um único e-mail.
#
# As duas janelas da noite (22h e 00h de Brasília) que cobrem o pregão
# de SEXTA caem sempre no SÁBADO. Sem janela de sábado, sexta-feira era
# o único dia da semana sem rede de segurança. Não foi azar: era
# estrutural, e ia se repetir toda sexta em que a B3 atrasasse.
# ====================================================================

on:
  schedule:
    # Horários em UTC. Brasília = UTC-3.
    # TODOS OS DIAS DA SEMANA — era exatamente esse o furo.
    - cron: "0  1 * * *"   # 22h Brasília — logo após a B3 publicar
    - cron: "0  4 * * *"   # 01h Brasília — B3 publicou atrasado
    - cron: "0 11 * * *"   # 08h Brasília — daqui em diante base atrasada = job VERMELHO
    - cron: "0 16 * * *"   # 13h Brasília — última rede do dia

  workflow_dispatch:
    inputs:
      ano:
        description: "Ano inteiro (ex: 2026) — use na carga inicial"
        required: false
      data:
        description: "Pregão específico (dd/mm/aaaa)"
        required: false
      dias:
        description: "Quantos dias úteis recentes tentar (padrão 10)"
        required: false

concurrency:
  # duas execuções não podem se atropelar escrevendo a mesma base
  group: coleta-diaria
  cancel-in-progress: false

env:
  TZ: America/Sao_Paulo
  # Sem isso o Python só descarrega o stdout no fim e o log sai fora de
  # ordem: no log de 05/09 os erros apareciam ANTES das linhas que
  # explicavam o que estava sendo baixado. Custou tempo de leitura.
  PYTHONUNBUFFERED: "1"

jobs:
  coletar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # checkout@v5 de propósito, não v6: o v6 mudou a forma de guardar a
      # credencial e o passo de publicação depende dela para o git push.
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Executar coleta
        run: |
          if [ -n "${{ github.event.inputs.ano }}" ]; then
            python coleta_cotahist.py --ano ${{ github.event.inputs.ano }}
          elif [ -n "${{ github.event.inputs.data }}" ]; then
            python coleta_cotahist.py --data "${{ github.event.inputs.data }}"
          else
            python coleta_cotahist.py --dias ${{ github.event.inputs.dias || '10' }}
          fi

      - name: Publicar base atualizada
        if: always()
        run: |
          git config user.name  "coleta-bot"
          git config user.email "coleta-bot@users.noreply.github.com"
          git add public/base_b3.json public/base_b3.csv
          if git diff --staged --quiet; then
            echo "Nada mudou."
          else
            # [skip ci] impede que este commit dispare um deploy no Netlify.
            # O app lê a base direto do GitHub, então republicar o site seria
            # gasto de crédito sem nenhum ganho.
            git commit -m "Base B3 — $(date +'%Y-%m-%d %H:%M') [skip ci]"
            git push
          fi

      # ------------------------------------------------------------------
      # ÚNICO passo que decide verde ou vermelho.
      #
      # A lista de feriados e a regra do pregão esperado agora vivem só
      # dentro do coleta_cotahist.py. Antes estavam duplicadas aqui dentro
      # do YAML — e já tinham divergido: a cópia do YAML não tinha 2027.
      #
      # A regra deixou de ser "que horas são" e passou a ser "quantas
      # horas desde o prazo de publicação daquele pregão" (8h de
      # tolerância = alarme às 07h do dia seguinte, em qualquer dia da
      # semana). Falha de download não derruba mais este job; o que
      # derruba é a base continuar atrasada depois do prazo.
      # ------------------------------------------------------------------
      - name: Verificar se a base alcançou o último pregão
        if: always()
        run: python coleta_cotahist.py --verificar
