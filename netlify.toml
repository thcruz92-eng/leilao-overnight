# Publica apenas a pasta public/, que contém tudo que o site precisa:
# index.html, app.js e a base coletada. Nada mais fica exposto.
# O comando abaixo não constrói nada — existe só para anular o "npm run build"
# salvo nas configurações do site (o netlify.toml tem precedência sobre a interface).
[build]
  command = "echo 'App ja compilado — nada a construir.'"
  publish = "public"
  functions = "netlify/functions"

  # Segunda camada de proteção de crédito. A primeira é o [skip ci] na
  # mensagem de commit da coleta; esta aqui cobre commit de dados feito
  # à mão, sem a marcação. Cada deploy de produção custa 15 créditos.
  #
  # Semântica: sai 0 -> cancela o deploy; sai 1 -> deploy roda.
  # git diff --quiet sai 0 quando NÃO há diferença fora dos arquivos listados.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':!public/base_b3.json' ':!public/base_b3.csv'"
