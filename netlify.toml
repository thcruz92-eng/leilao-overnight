# Publica apenas a pasta public/, que contém tudo que o site precisa:
# index.html, app.js e a base coletada. Nada mais fica exposto.
# O comando abaixo não constrói nada — existe só para anular o "npm run build"
# salvo nas configurações do site (o netlify.toml tem precedência sobre a interface).
[build]
  command = "echo 'App ja compilado — nada a construir.'"
  publish = "public"
  functions = "netlify/functions"

  # Cada deploy de produção custa 15 créditos. O commit diário da coleta
  # só mexe em public/base_b3.json — e o app lê esse arquivo do
  # raw.githubusercontent.com, não daqui. Publicar o site de novo por
  # causa dele é pagar 15 créditos por nada, todo dia útil.
  #
  # Semântica do ignore: sai 0 -> cancela o deploy; sai 1 -> deploy roda.
  # git diff --quiet sai 0 quando NÃO há diferença. Então: se a única
  # mudança foi a base, não há diferença fora dela, sai 0, deploy cancelado.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':!public/base_b3.json'"
